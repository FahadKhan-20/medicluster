version: '3.8'

services:
  frontend:
    build: ./frontend
    ports:
      - "3000:3000"
    depends_on:
      - backend
    environment:
      - BACKEND_URL=http://backend:5000

  backend:
    build: ./backend
    ports:
      - "5000:5000"
    environment:
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-${SUPABASE_SERVICE_ROLE_KEY:?Set SUPABASE_SECRET_KEY or SUPABASE_SERVICE_ROLE_KEY}}
      SUPABASE_SERVICE_ROLE_KEY: ${SUPABASE_SERVICE_ROLE_KEY:-}
      JWT_SECRET: ${JWT_SECRET:?Set JWT_SECRET}
      AGENT_JWT_SECRET: ${AGENT_JWT_SECRET:?Set AGENT_JWT_SECRET}
      PATIENT_PUBLIC_ORIGIN: ${PATIENT_PUBLIC_ORIGIN:-http://localhost:3000}
      ML_ENGINE_URL: http://ml-engine:8000
      PORT: 5000
    depends_on:
      - ml-engine

  ml-engine:
    build: ./ml-engine
    ports:
      - "8000:8000"

  agent-core:
    build: ../agent-core
    restart: unless-stopped
    ports:
      - "8100:8100"
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      - backend
    environment:
      SUPABASE_URL: ${SUPABASE_URL:?Set SUPABASE_URL}
      SUPABASE_SECRET_KEY: ${SUPABASE_SECRET_KEY:-${SUPABASE_SERVICE_ROLE_KEY:?Set SUPABASE_SECRET_KEY or SUPABASE_SERVICE_ROLE_KEY}}
      BACKEND_URL: http://backend:5000
      AGENT_JWT_SECRET: ${AGENT_JWT_SECRET:?Set AGENT_JWT_SECRET}
      AGENT_ADMIN_KEY: ${AGENT_ADMIN_KEY:?Set AGENT_ADMIN_KEY}
      OMNIROUTE_URL: ${OMNIROUTE_URL:-http://localhost:20128}
      OMNIROUTE_API_KEY: ${OMNIROUTE_API_KEY:-}
      AGENT_MODEL: ${AGENT_MODEL:-agy/gemini-3.8-flash-medium}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:?Set OPENROUTER_API_KEY}
      JEV_MODEL: ${JEV_MODEL:-typesafe/jev-1.13}
      ML_URL: http://ml-engine:8000
      AGENT_PORT: 8100
